{% extends 'base.html' %}
{% block titulo %}Eliminar pedido{% endblock %}
{% block contenido %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-lg rounded-3">
                <div class="card-header bg-danger text-white text-center">
                    <h4 class="mb-0">
                        <i class="bi bi-trash"></i> ¿Seguro que deseas eliminar este pedido?
                    </h4>
                </div>
                <div class="card-body">
                    <form action="" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" value="{{ pedido.1 }}" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Stock</label>
                            <input type="number" class="form-control" value="{{ pedido.2 }}" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nombre Caja</label>
                            <input type="text" class="form-control" value="{{ pedido.3 }}" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" class="form-control" value="{{ pedido.4 }}" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Dirección</label>
                            <textarea class="form-control" rows="3" disabled>{{ pedido.5 }}</textarea>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="/pedidos/" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Volver
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-trash"></i> Eliminar Pedido
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
