{% extends 'base.html' %}
{% block titulo %}Editar pedido{% endblock %}
{% block contenido %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-lg rounded-3">
                <div class="card-header bg-warning text-dark text-center">
                    <h4 class="mb-0">
                        <i class="bi bi-pencil-square"></i> Editar Pedido
                    </h4>
                </div>
                <div class="card-body">
                    <form action="" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" name="Nombre"
                                   required maxlength="100" value="{{ pedido[1] }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Stock</label>
                            <input type="number" class="form-control" name="Stock"
                                   required min="1" value="{{ pedido[2] }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nombre Caja</label>
                            <input type="text" class="form-control" name="NombreCaja"
                                   required maxlength="100" value="{{ pedido[3] }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" class="form-control" name="Telefono"
                                   required maxlength="50" value="{{ pedido[4] }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Dirección</label>
                            <textarea class="form-control" name="Direccion" rows="3" required>{{ pedido[5] }}</textarea>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="/pedidos/" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Volver
                            </a>
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-save"></i> Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
