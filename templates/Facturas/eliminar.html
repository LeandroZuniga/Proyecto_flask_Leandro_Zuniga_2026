{% extends 'base.html' %}
{% block titulo %}Eliminar factura{% endblock %}
{% block contenido %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-lg rounded-3">
                <div class="card-header bg-danger text-white text-center">
                    <h4 class="mb-0">
                        <i class="bi bi-trash"></i> ¿Seguro que deseas eliminar esta factura?
                    </h4>
                </div>
                <div class="card-body">
                    <form action="/facturas/eliminar/{{ factura.0 }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Código del Pedido</label>
                            <input type="number" class="form-control" value="{{ factura.1 }}" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fecha</label>
                            <input type="date" class="form-control" value="{{ factura.2 }}" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Total</label>
                            <input type="number" class="form-control" value="{{ factura.3 }}" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Método de Pago</label>
                            <input type="text" class="form-control" value="{{ factura.4 }}" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Estado</label>
                            <input type="text" class="form-control" value="{{ factura.5 }}" disabled>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="/facturas/" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Volver
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-trash-fill"></i> Eliminar Factura
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
