{% extends 'base.html' %}
{% block titulo %}Editar factura{% endblock %}
{% block contenido %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-lg rounded-3">
                <div class="card-header bg-warning text-dark text-center">
                    <h4 class="mb-0">
                        <i class="bi bi-pencil-square"></i> Editar Factura
                    </h4>
                </div>
                <div class="card-body">
                    <form action="/facturas/editar/{{ factura.0 }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Código Pedido</label>
                            <input type="number" class="form-control" name="CodigoPedido"
                                   value="{{ factura.1 }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fecha</label>
                            <input type="date" class="form-control" name="Fecha"
                                   value="{{ factura.2 }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Total</label>
                            <input type="number" class="form-control" step="0.01" name="Total"
                                   value="{{ factura.3 }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Método de Pago</label>
                            <input type="text" class="form-control" name="MetodoPago"
                                   value="{{ factura.4 }}" required maxlength="100">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Estado</label>
                            <input type="text" class="form-control" name="Estado"
                                   value="{{ factura.5 }}" required maxlength="100">
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="/facturas/" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Volver
                            </a>
                            <button type="submit" class="btn btn-warning">
                                <i class="bi bi-save"></i> Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
