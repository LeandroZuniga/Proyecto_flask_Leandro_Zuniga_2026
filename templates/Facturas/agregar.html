{% extends 'base.html' %}
{% block titulo %}Agregar nueva factura{% endblock %}
{% block contenido %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg rounded-3">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="mb-0">Nueva Factura</h4>
                </div>
                <div class="card-body">
                    <form action="/facturas/agregar" method="post">
                        <div class="mb-3">
                            <label class="form-label">Código del Pedido</label>
                            <input type="number" class="form-control" name="CodigoPedido" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Fecha</label>
                            <input type="date" class="form-control" name="Fecha" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Total</label>
                            <input type="number" class="form-control" name="Total" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Método de Pago</label>
                            <input type="text" class="form-control" name="MetodoPago" required maxlength="100">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Estado</label>
                            <input type="text" class="form-control" name="Estado" required maxlength="100">
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="/facturas/" class="btn btn-secondary">Volver</a>
                            <button type="submit" class="btn btn-primary">Agregar Factura</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
